<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Logic Map</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f5f5f7; --card: #ffffff; --sunk: #f0f0f3; --line: #d1d1d6; --soft: #e5e5e7;
    --text: #1d1d1f; --muted: #6e6e73; --faint: #aeaeb2; --accent: #0071e3;
    --teal: #1f9e8f; --keep: #248a3d; --keep-bg: #e9f9ee; --block: #d70015; --block-bg: #fdecea; --wait: #b25000; --wait-bg: #fff4e5;
    --purple: #9b3fd1; --purple-bg: #f5ecfc; --route: #0071e3; --route-bg: #e8f1fd;
    --real: #1d6040; --real-bg: #e6f2ea; --will: #2f4aa6; --will-bg: #e9edfb; --est: #8a520f; --est-bg: #fbf0e1;
    --ask: #e8b100;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1d1d1f; --card: #2c2c2e; --sunk: #242426; --line: #424245; --soft: #3a3a3c;
      --text: #f5f5f7; --muted: #a1a1a6; --faint: #636366; --accent: #409cff;
      --teal: #40c8b8; --keep: #30d158; --keep-bg: #183a22; --block: #ff6961; --block-bg: #451c1a; --wait: #ffb340; --wait-bg: #3d2e12;
      --purple: #bf5af2; --purple-bg: #2f2340; --route: #409cff; --route-bg: #16304d;
      --real: #7fd6a4; --real-bg: #16301f; --will: #a9b8ff; --will-bg: #1b2340; --est: #f2bf73; --est-bg: #33240f;
      --ask: #ffd60a;
    }
  }
  /* Who does a step, the same colors as the charts: --f fill, --b border, --c a strong color for dots and bars */
  .tn-code { --f: #f2f2f7; --b: #8e8e93; --c: #8e8e93; } .tn-deep { --f: #e6f6f4; --b: #30b0a0; --c: #30b0a0; }
  .tn-opus { --f: #f5ecfc; --b: #af52de; --c: #af52de; } .tn-will { --f: #fff6e5; --b: #ff9500; --c: #ff9500; }
  .tn-keep { --f: #e9f9ee; --b: #34c759; --c: #34c759; } .tn-route { --f: #e8f1fd; --b: #0071e3; --c: #0071e3; }
  .tn-block { --f: #fdecea; --b: #ff3b30; --c: #ff3b30; } .tn-next { --f: transparent; --b: #aeaeb2; --c: #aeaeb2; }
  .tn-wait { --f: #fff4e5; --b: #e08a00; --c: #e08a00; }
  @media (prefers-color-scheme: dark) {
    .tn-code { --f: #3a3a3c; } .tn-deep { --f: #123430; } .tn-opus { --f: #2f2340; --b: #bf5af2; --c: #bf5af2; } .tn-will { --f: #3d2e12; --b: #ff9f0a; --c: #ff9f0a; }
    .tn-keep { --f: #183a22; } .tn-route { --f: #16304d; --b: #0a84ff; --c: #0a84ff; } .tn-block { --f: #451c1a; --b: #ff453a; --c: #ff453a; }
    .tn-next { --b: #8e8e93; --c: #8e8e93; } .tn-wait { --f: #3d2e12; --b: #ffb340; --c: #ffb340; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.5; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  button { font: inherit; color: inherit; }

  /* Top bar: where you are, and the flip */
  .top { flex: none; display: flex; align-items: center; gap: 12px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--bg); }
  .crumbs { flex: 1; min-width: 0; display: flex; align-items: center; gap: 2px; overflow-x: auto; scrollbar-width: none; white-space: nowrap; }
  .crumbs::-webkit-scrollbar { display: none; }
  .crumbs button { border: 0; background: none; color: var(--muted); font-weight: 600; font-size: 14px; padding: 7px 8px; border-radius: 8px; cursor: pointer; }
  .crumbs button:hover { background: var(--soft); color: var(--text); }
  .crumbs button[aria-current] { color: var(--text); cursor: default; background: none; }
  .crumbs .sep { color: var(--faint); font-size: 14px; }
  /* The first crumb opens the list of modules. */
  /* It sticks to the left edge, so the path can scroll to its end on a phone and the module button stays in view. */
  .crumbs .modbtn { display: inline-flex; align-items: center; gap: 7px; position: sticky; left: 0; z-index: 1; background: var(--bg); }
  .crumbs .modbtn.here { color: var(--text); }
  .crumbs .modbtn .chev { width: 6px; height: 6px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: translateY(-2px) rotate(45deg); opacity: .75; transition: transform .15s ease; }
  .crumbs .modbtn[aria-expanded="true"] { background: var(--soft); color: var(--text); }
  .crumbs .modbtn[aria-expanded="true"] .chev { transform: translateY(1px) rotate(225deg); }
  .modmenu { position: fixed; z-index: 45; margin: 0; padding: 6px; list-style: none; min-width: 220px; max-width: calc(100vw - 32px); background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.22); }
  .modmenu button { display: block; width: 100%; text-align: left; border: 0; background: none; border-radius: 8px; padding: 9px 12px; font-weight: 600; font-size: 14px; color: var(--text); cursor: pointer; overflow-wrap: anywhere; }
  .modmenu button:hover, .modmenu button:focus-visible { background: var(--soft); outline: none; }
  .modmenu button[aria-current="true"] { color: var(--accent); }
  .switch { flex: none; display: inline-flex; background: var(--soft); border-radius: 10px; padding: 3px; }
  .switch button { border: 0; background: none; font-weight: 600; font-size: 13.5px; color: var(--muted); padding: 6px 13px; border-radius: 8px; cursor: pointer; min-height: 34px; }
  .switch button[aria-pressed="true"] { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.18); }

  /* Parts that are out of date against the part above them */
  .stale { flex: none; background: var(--wait-bg); color: var(--wait); border-bottom: 1px solid var(--wait); padding: 8px 16px; font-size: 14px; }
  .stale b { margin-right: 4px; }

  /* The page */
  .view { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; position: relative; outline: none; }
  .page { max-width: 1240px; margin: 0 auto; padding: 28px 16px 36px; }
  .kicker { margin: 0 0 4px; font-size: 13px; font-weight: 600; color: var(--teal); letter-spacing: .02em; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
  .st { font-size: 12px; font-weight: 600; color: var(--keep); background: var(--keep-bg); border: 1px solid var(--keep); border-radius: 999px; padding: 0 9px; }
  .st.next { color: var(--muted); background: transparent; border-color: var(--faint); border-style: dashed; }
  h1 { font-size: 30px; line-height: 1.2; margin: 0 0 10px; letter-spacing: -.01em; max-width: 1000px; overflow-wrap: anywhere; }
  .lede { color: var(--muted); font-size: 16.5px; margin: 0 0 16px; max-width: 820px; }

  .legend { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0 4px; }
  .chip { font-size: 12.5px; border: 1.5px solid var(--b); background: var(--f); border-radius: 999px; padding: 1px 10px; }
  .chip.tn-next { border-style: dashed; }

  /* The flowchart. A box that opens glows on hover, in its own color. */
  .chart { margin-top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; overflow-x: auto; min-height: 120px; }
  .chart svg { display: block; margin: 0 auto; max-width: none; height: auto; }
  @media (min-width: 641px) { .chart svg { max-width: 100%; } } /* fit on a computer; scroll sideways on a phone */
  .chart .drawing, .chart .chart-err { color: var(--muted); font-size: 14px; margin: 30px 0; text-align: center; }
  /* Example off: a box that opens glows. Example on: every step glows, and the picked step keeps its glow. */
  .view:not(.ex-on) .chart g.node.drill, .view.ex-on .chart g.node.ex { cursor: pointer; }
  .chart g.node > rect, .chart g.node > polygon, .chart g.node > path { transition: filter .18s ease, stroke-width .18s ease; }
  .view:not(.ex-on) .chart g.node.drill:hover > :is(rect, polygon, path),
  .view:not(.ex-on) .chart g.node.drill:focus-visible > :is(rect, polygon, path),
  .view.ex-on .chart g.node.ex:hover > :is(rect, polygon, path),
  .view.ex-on .chart g.node.ex:focus-visible > :is(rect, polygon, path),
  .view.ex-on .chart g.node.sel > :is(rect, polygon, path) {
    stroke-width: 2.5px !important; filter: url(#glow-own); animation: none;
  }
  .view.ex-on .chart g.node.sel > :is(rect, polygon, path) { stroke-width: 3.5px !important; }
  .chart g.node:focus { outline: none; }
  /* A question for Will waits in this box or below it: a yellow glow that pulses, so it never reads as the hover glow. */
  /* The glows are SVG filters (the svg.defs below): Safari's engine (WebKit) ignores CSS drop-shadow on chart shapes. */
  .chart g.node.ask > :is(rect, polygon, path) { filter: url(#glow-ask-light); }
  @media (prefers-color-scheme: dark) { .chart g.node.ask > :is(rect, polygon, path) { filter: url(#glow-ask-dark); } }
  svg.defs { position: absolute; width: 0; height: 0; overflow: hidden; }
  .chip.ask { border: 1.5px solid var(--ask); background: transparent; box-shadow: 0 0 8px var(--ask); }

  /* The Example switch and the example under the flowchart */
  .extog { flex: none; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 12px 5px 6px; font-weight: 600; font-size: 13.5px; color: var(--muted); cursor: pointer; min-height: 34px; }
  .extog .sw { width: 30px; height: 18px; border-radius: 999px; background: var(--soft); position: relative; transition: background-color .2s; }
  .extog .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .2s; }
  .extog[aria-checked="true"] { color: var(--text); border-color: var(--accent); }
  .extog[aria-checked="true"] .sw { background: var(--accent); }
  .extog[aria-checked="true"] .sw::after { transform: translateX(12px); }
  /* The Questions switch and its list: every open question, where it waits, and a click opens its slide. */
  .qtog .qn { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--ask); color: #1d1d1f; font-size: 12px; font-weight: 700; display: inline-grid; place-items: center; }
  .qtog .qn.zero { background: var(--soft); color: var(--muted); }
  .qpanel { flex: none; max-height: 45vh; overflow-y: auto; background: var(--card); border-bottom: 1px solid var(--line); padding: 12px 16px 14px; }
  .qpanel ul { list-style: none; margin: 0 auto; padding: 0; max-width: 1240px; display: grid; gap: 8px; }
  .qpanel li button { width: 100%; text-align: left; border: 1.5px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px 14px; cursor: pointer; display: grid; gap: 3px; }
  .qpanel li button:hover, .qpanel li button:focus-visible { border-color: var(--ask); outline: none; }
  .qpanel .qq { font-weight: 600; font-size: 14.5px; color: var(--text); overflow-wrap: anywhere; }
  .qpanel .qwhere { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .qpanel .qstate { font-size: 12.5px; font-weight: 700; color: var(--wait); }
  .qpanel .qstate.done { color: var(--keep); }
  .qpanel .empty { margin: 0 auto; max-width: 1240px; color: var(--muted); font-size: 14px; }
  .expanel { margin-top: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px 18px; }
  .expanel h2 { margin: 2px 0 12px; font-size: 22px; line-height: 1.25; letter-spacing: -.01em; }
  .exhint { margin: 0; color: var(--muted); font-size: 15px; }

  /* Slide text */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 10px; margin: 16px 0 6px; max-width: 1000px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 13px 15px; }
  .stat .v { font-size: 30px; font-weight: 700; letter-spacing: -.01em; line-height: 1.15; }
  .stat .d { font-size: 14px; color: var(--muted); margin: 2px 0 8px; }
  .tag { display: inline-block; font-size: 11.5px; font-weight: 600; border-radius: 6px; padding: 1px 7px; }
  .t-real { color: var(--real); background: var(--real-bg); } .t-will { color: var(--will); background: var(--will-bg); } .t-claude { color: var(--est); background: var(--est-bg); }
  .t-plan { color: var(--muted); border: 1px dashed var(--faint); }
  .vcap { color: var(--muted); font-size: 14.5px; margin: 12px 2px 0; max-width: 900px; }
  .quote { margin: 18px 0 4px; max-width: 860px; border-left: 3px solid var(--will); padding: 4px 0 4px 16px; }
  .quote q { font-size: 18px; line-height: 1.4; quotes: "\201C" "\201D"; overflow-wrap: anywhere; }
  .quote span { display: block; margin-top: 4px; font-size: 13px; color: var(--muted); }
  .tbl { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; margin-top: 14px; max-width: 1000px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 9px 12px; border-bottom: 1px solid var(--soft); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  td.s { font-style: italic; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
  .note { color: var(--muted); font-size: 13.5px; margin: 8px 2px 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .pill { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 6px; padding: 1px 7px; border: 1px solid; white-space: nowrap; }
  .p-keep { color: var(--keep); background: var(--keep-bg); border-color: var(--keep); }
  .p-route { color: var(--route); background: var(--route-bg); border-color: var(--route); }
  .p-block { color: var(--block); background: var(--block-bg); border-color: var(--block); }
  .p-opus { color: var(--purple); background: var(--purple-bg); border-color: var(--purple); }
  .p-unclear, .p-wait { color: var(--muted); background: transparent; border-color: var(--faint); }
  .golink { border: 1px solid var(--accent); color: var(--accent); background: var(--card); border-radius: 10px; padding: 8px 13px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 20px; display: inline-flex; gap: 8px; align-items: center; }
  .golink small { color: var(--muted); font-weight: 500; }

  /* A decision that waits */
  .decide { margin-top: 22px; border: 1.5px solid var(--wait); background: var(--wait-bg); border-radius: 14px; padding: 14px 16px; max-width: 860px; }
  .decide .kicker { color: var(--wait); }
  .decide .q { font-size: 17px; font-weight: 600; margin: 2px 0 12px; }
  .opts { display: grid; gap: 8px; }
  .opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; border: 1.5px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 12px; cursor: pointer; }
  .opt:hover { border-color: var(--accent); }
  .opt.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
  .opt .n { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--sunk); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
  .opt.on .n { background: var(--accent); color: #fff; }
  .opt b { display: block; font-size: 15px; }
  .opt small { display: block; color: var(--muted); font-size: 13px; }
  .opt .pick { font-style: normal; font-size: 12px; font-weight: 600; color: var(--est); margin-left: 6px; }
  .decide-note { font-size: 13px; color: var(--muted); margin: 10px 0 0; }

  /* Pictures on slides. Each starts visible and only moves, so a frozen first frame still shows it. */
  .visual { margin: 10px 0 6px; max-width: 1000px; }
  .vtitle { font-size: 12.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 8px; }
  .vflow { display: grid; gap: 18px; }
  .vrow { display: flex; align-items: stretch; flex-wrap: nowrap; }
  .vbox { flex: 1 1 0; min-width: 0; max-width: 220px; border: 1.5px solid var(--b); background: var(--f); border-radius: 12px; padding: 10px 12px; transition: box-shadow .3s ease, transform .3s ease; }
  .vbox.tn-next { border-style: dashed; }
  .vbox b { display: block; font-size: 14.5px; line-height: 1.3; overflow-wrap: anywhere; }
  .vbox span { display: block; font-size: 12.5px; color: var(--muted); margin-top: 3px; overflow-wrap: anywhere; }
  .vbox.on { box-shadow: 0 0 0 3px color-mix(in srgb, var(--b) 35%, transparent), 0 0 20px color-mix(in srgb, var(--b) 55%, transparent); transform: translateY(-2px); }
  .varrow { flex: none; align-self: center; width: 28px; height: 2px; background: var(--line); position: relative; margin: 0 5px; transition: background-color .25s; }
  .varrow::after { content: ""; position: absolute; right: -2px; top: -5px; border: 6px solid transparent; border-left-color: var(--line); border-right: 0; transition: border-color .25s; }
  .varrow.on { background: var(--accent); } .varrow.on::after { border-left-color: var(--accent); }
  .vend { flex: 1 1 0; min-width: 0; max-width: 240px; display: grid; gap: 8px; align-content: center; }
  .vend .vbox { max-width: none; }
  .vdots { display: flex; flex-wrap: wrap; gap: 5px; max-width: 760px; }
  .vdots i { width: 14px; height: 14px; border-radius: 50%; background: var(--soft); transition: background-color .25s, transform .25s; }
  .vdots.big i { width: 34px; height: 34px; }
  .vdots i.on { background: var(--c); }
  .vlegend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; font-size: 14px; color: var(--muted); }
  .vlegend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--c); margin-right: 7px; }
  .vlegend b { color: var(--text); }
  .vbars { display: grid; gap: 14px; max-width: 900px; }
  .vbars.marks { gap: 30px; padding-bottom: 22px; }
  .vbar .vval { position: absolute; top: 50%; transform: translateY(-50%); font-size: 12.5px; font-weight: 700; white-space: nowrap; }
  .vbar-label { font-size: 14px; margin-bottom: 5px; }
  .vbar { position: relative; height: 28px; background: var(--soft); border-radius: 8px; }
  .vbar .fill { display: flex; height: 100%; border-radius: 8px; overflow: hidden; transform-origin: left; transform: scaleX(var(--g, 1)); transition: transform .8s cubic-bezier(.3,.7,.2,1); }
  .vbar .seg { flex: none; height: 100%; background: var(--c); display: flex; align-items: center; padding: 0 9px; font-size: 12.5px; font-weight: 700; color: #111; white-space: nowrap; overflow: hidden; min-width: 0; }
  .vbar .mark { position: absolute; top: -5px; bottom: -5px; width: 2px; margin-left: -1px; background: var(--text); opacity: .6; }
  .vbar .mark span { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 3px; font-size: 11px; color: var(--muted); white-space: nowrap; font-style: normal; }
  .vgate { display: grid; gap: 8px; max-width: 760px; }
  .vgate .g { display: flex; gap: 12px; align-items: flex-start; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; transition: border-color .3s, transform .3s; }
  .vgate .g.on { transform: translateX(4px); }
  .vgate .ic { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; background: var(--soft); color: var(--muted); transition: background-color .3s, color .3s; }
  .vgate .g.on.pass { border-color: var(--keep); } .vgate .g.on.pass .ic { background: var(--keep-bg); color: var(--keep); }
  .vgate .g.on.stop { border-color: var(--block); } .vgate .g.on.stop .ic { background: var(--block-bg); color: var(--block); }
  .vgate .g.on.hold, .vgate .g.on.wait { border-color: var(--wait); } .vgate .g.on.hold .ic, .vgate .g.on.wait .ic { background: var(--wait-bg); color: var(--wait); }
  .vgate .g b { display: block; font-size: 15px; }
  .vgate .g span { display: block; font-size: 13px; color: var(--muted); }
  .vgate .gend { display: flex; flex-direction: column; align-items: flex-start; margin-top: 2px; }
  .vgate .gend .varrow { transform: rotate(90deg); margin: 14px 0 12px 10px; }
  .vgate .gend .vbox { max-width: 320px; }
  .vcard { max-width: 620px; background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; padding: 14px 18px 16px; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
  .vcard h4 { margin: 0 0 10px; font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .vcard dl { display: grid; grid-template-columns: max-content 1fr; gap: 7px 16px; margin: 0; }
  .vcard dt { color: var(--muted); font-size: 13.5px; }
  .vcard dd { margin: 0; font-size: 15px; overflow-wrap: anywhere; }
  .vcard .stamp { margin-top: 14px; display: inline-block; border: 1.5px dashed var(--b); color: var(--c); border-radius: 8px; padding: 4px 10px; font-size: 13px; font-weight: 700; transform: rotate(-1.5deg); }
  .vscale { padding: 30px 10px 6px; max-width: 900px; }
  .vaxis { position: relative; height: 46px; }
  .vaxis .track { position: absolute; left: 0; right: 0; top: 18px; height: 4px; background: var(--soft); border-radius: 2px; }
  .vaxis .zone { position: absolute; top: 12px; height: 16px; border-radius: 6px; background: var(--c); opacity: .22; }
  .vaxis .line { position: absolute; top: -8px; height: 44px; width: 2px; margin-left: -1px; background: var(--c); }
  .vaxis .line span { position: absolute; bottom: calc(100% + var(--ly, 0px)); left: 50%; transform: translateX(-50%); font-size: 12px; font-weight: 700; color: var(--c); white-space: nowrap; font-style: normal; }
  .vaxis .dot { position: absolute; top: 12px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: var(--c); border: 2px solid var(--bg); }
  .vaxis .tick { position: absolute; top: 32px; font-size: 11px; color: var(--muted); transform: translateX(-50%); font-style: normal; }
  .vzones { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 10px; margin-top: 14px; max-width: 900px; }
  .vzones > div { background: var(--card); border: 1px solid var(--line); border-top: 3px solid var(--c); border-radius: 10px; padding: 8px 12px; }
  .vzones h5 { margin: 0 0 3px; font-size: 13px; color: var(--c); }
  .vzones p { margin: 0; font-size: 13.5px; color: var(--muted); }
  .runs { display: flex; flex-wrap: wrap; gap: 8px; margin: 2px 0 14px; }
  .runs button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 13px; font-size: 14px; cursor: pointer; }
  .runs button.s { font-style: italic; }
  .runs button.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); color: var(--accent); }
  .steps { list-style: none; margin: 0; padding: 0 0 0 30px; position: relative; max-width: 900px; }
  .steps::before { content: ""; position: absolute; left: 10px; top: 10px; bottom: 10px; width: 2px; background: var(--line); }
  .steps .prog { position: absolute; left: 10px; top: 10px; width: 2px; height: calc(100% - 20px); background: var(--accent); transform-origin: top; transform: scaleY(var(--p, 1)); transition: transform .45s ease; }
  .steps > li { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 9px 14px; margin: 0 0 8px; transition: border-color .3s; }
  .steps > li::before { content: ""; position: absolute; left: -25px; top: 14px; width: 10px; height: 10px; border-radius: 50%; background: var(--bg); border: 2px solid var(--faint); transition: background-color .3s, border-color .3s; }
  .steps > li.on { border-color: var(--accent); }
  .steps > li.on::before { background: var(--accent); border-color: var(--accent); }
  .steps > li b { display: block; font-size: 15px; }
  .steps > li span { display: block; font-size: 14px; color: var(--muted); }
  .steps.time > li b { color: var(--teal); font-size: 13px; letter-spacing: .02em; }
  .steps.time > li span { color: var(--text); font-size: 15px; }
  .jfoot { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-top: 4px; font-size: 14px; color: var(--muted); }
  .again { border: 0; background: none; color: var(--accent); font-weight: 600; cursor: pointer; padding: 0; font-size: 14px; }

  /* Slides */
  .view.slides { overflow: hidden; }
  .deck { position: absolute; inset: 0; }
  .slide { position: absolute; inset: 0; overflow-y: auto; display: none; }
  .slide.on { display: block; }
  .slide .page { padding-top: 34px; }
  .slide h1 { font-size: 34px; }
  .nav { flex: none; display: flex; align-items: center; justify-content: center; gap: 14px; padding: 8px 16px; border-top: 1px solid var(--line); background: var(--bg); }
  .arrow { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); font-size: 20px; line-height: 1; cursor: pointer; }
  .arrow:disabled { opacity: .35; cursor: default; }
  .dots { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; max-width: 60vw; }
  .dot { width: 10px; height: 10px; border-radius: 50%; border: 0; padding: 0; background: var(--faint); cursor: pointer; }
  .dot.on { background: var(--accent); transform: scale(1.25); }
  .count { font-size: 12.5px; color: var(--muted); min-width: 44px; text-align: center; font-variant-numeric: tabular-nums; }

  /* Notes bar: notes stay here until Copy answers */
  .bar { flex: none; border-top: 1px solid var(--line); background: var(--card); padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); }
  .bar-in { max-width: 1240px; margin: 0 auto; }
  .here { list-style: none; margin: 0 0 8px; padding: 0; display: grid; gap: 6px; max-height: 22vh; overflow-y: auto; }
  .here li { display: flex; gap: 8px; align-items: flex-start; background: var(--sunk); border-radius: 10px; padding: 6px 8px 6px 12px; font-size: 14px; }
  .here li span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .here li em { font-style: normal; font-size: 11.5px; font-weight: 600; color: var(--muted); margin-right: 6px; }
  .here li button { flex: none; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; padding: 2px 6px; border-radius: 6px; }
  .here li button:hover { background: var(--soft); color: var(--text); }
  form.ask { display: flex; gap: 8px; align-items: center; }
  .about { flex: none; font-size: 12px; color: var(--muted); max-width: 30%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .about b { color: var(--text); font-weight: 600; }
  #q { flex: 1; min-width: 0; font: inherit; font-size: 15px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  #q:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
  .b-add, .b-copy { flex: none; font-weight: 600; font-size: 14px; padding: 10px 14px; border-radius: 12px; cursor: pointer; white-space: nowrap; }
  .b-add { border: 1px solid var(--line); background: var(--bg); }
  .b-copy { border: 0; background: var(--accent); color: #fff; }
  .b-copy .n { display: inline-block; min-width: 20px; margin-left: 6px; padding: 0 6px; border-radius: 999px; background: rgba(255,255,255,.25); font-size: 12.5px; }
  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 50; max-width: min(560px, calc(100vw - 32px)); background: var(--text); color: var(--bg); border-radius: 12px; padding: 10px 14px; font-size: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.25); display: flex; gap: 12px; align-items: center; }
  .toast button { border: 0; background: none; color: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; padding: 0; white-space: nowrap; }
  .zoombox { position: fixed; z-index: 40; border: 1.5px solid var(--line); border-radius: 12px; pointer-events: none; }
  dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: var(--text); max-width: min(640px, calc(100vw - 32px)); width: 100%; }
  dialog textarea { width: 100%; font: 13px/1.5 ui-monospace, Menlo, monospace; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  dialog form { margin-top: 10px; text-align: right; }

  @media (max-width: 640px) {
    /* Phone: the path gets its own line, the switches a row of their own. */
    .top { flex-wrap: wrap; gap: 6px 8px; }
    .crumbs { flex: 1 1 100%; }
    .switch { margin-left: auto; }
    .qtog .qword { display: none; }
    .extog:not(.qtog) .sw { display: none; }
    .extog:not(.qtog) { padding-left: 12px; }
    h1, .slide h1 { font-size: 24px; }
    .page { padding: 20px 16px 28px; }
    .about { display: none; }
    .b-add, .b-copy { padding: 10px 11px; }
    .b-copy .more { display: none; }
    .stat .v { font-size: 26px; }
    .quote q { font-size: 16.5px; }
    .toast { bottom: 88px; }
    .vrow { flex-direction: column; align-items: stretch; }
    .vbox, .vend { max-width: none; flex: none; }
    .varrow { transform: rotate(90deg); margin: 14px auto; }
    .vdots.big i { width: 28px; height: 28px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
  <!-- A box that opens: a glow in its own colors (its blurred, brightened shape under it). -->
  <filter id="glow-own" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
    <feColorMatrix in="blur" type="matrix" values="2.6 0 0 0 0  0 2.6 0 0 0  0 0 2.6 0 0  0 0 0 1.8 0" result="bright"/>
    <feMerge><feMergeNode in="bright"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <!-- A question waits in this box or below it: a yellow glow that pulses. -->
  <filter id="glow-ask-dark" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB">
    <feMorphology in="SourceAlpha" operator="dilate" radius="3" result="grow"/>
    <feGaussianBlur in="grow" stdDeviation="3" result="tight"/>
    <feGaussianBlur in="grow" stdDeviation="9" result="wide"/>
    <feFlood flood-color="#ffd60a" result="color"><animate attributeName="flood-opacity" values="1;0.55;1" dur="2.4s" repeatCount="indefinite"/></feFlood>
    <feComposite in="color" in2="tight" operator="in" result="ring"/>
    <feComposite in="color" in2="wide" operator="in" result="halo"/>
    <feMerge><feMergeNode in="halo"/><feMergeNode in="ring"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-ask-light" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB">
    <feMorphology in="SourceAlpha" operator="dilate" radius="3" result="grow"/>
    <feGaussianBlur in="grow" stdDeviation="3" result="tight"/>
    <feGaussianBlur in="grow" stdDeviation="9" result="wide"/>
    <feFlood flood-color="#e8b100" result="color"><animate attributeName="flood-opacity" values="1;0.55;1" dur="2.4s" repeatCount="indefinite"/></feFlood>
    <feComposite in="color" in2="tight" operator="in" result="ring"/>
    <feComposite in="color" in2="wide" operator="in" result="halo"/>
    <feMerge><feMergeNode in="halo"/><feMergeNode in="ring"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</svg>
